        // --- STATE MANAGEMENT ---
        let currentStoryId = null;

        let sceneHistory = [];
        const container = document.getElementById('app-container');
        const bgLayer = document.getElementById('bg-layer');

        // --- CORE FUNCTIONS ---
        
        // Handles UI transitions
        function transitionTo(renderCallback) {
            container.classList.add('fade-out');
            bgLayer.classList.add('opacity-0'); // Fade out background too

            setTimeout(() => {
                renderCallback();
                // Force reflow
                void container.offsetWidth;
                container.classList.remove('fade-out');
                bgLayer.classList.remove('opacity-0');
            }, 600); // Wait for CSS transition
        }

        // Initialize App to Main Menu
        function initApp() {
            currentStoryId = null;
            currentSceneId = null;
            sceneHistory = [];
            bgLayer.style.backgroundImage = `url('${defaultMenuBg}')`;
            renderMenu();
        }

        // Render the Main Menu
        function renderMenu() {
            container.innerHTML = `
                <div class="text-center">
                    <h1 class="font-heading text-4xl md:text-5xl font-bold mb-4 tracking-wide text-gray-100">
                        Psychological Thrillers
                    </h1>
                    <p class="text-gray-400 italic mb-10 max-w-lg mx-auto">
                        Two narratives of morality, consequence, and the masks we wear. Choose your path.
                    </p>
                    <div class="flex flex-col gap-6 max-w-md mx-auto">
                        <button onclick="startStory('story1')" class="choice-btn group block w-full text-left bg-transparent border border-gray-700 hover:border-brand-accent p-6 rounded-md cursor-pointer">
                            <span class="block font-heading text-2xl font-bold text-gray-200 group-hover:text-white transition-colors duration-300">
                                ${stories.story1.title}
                            </span>
                            <span class="block mt-2 text-sm text-gray-400 font-body group-hover:text-gray-300 transition-colors duration-300">
                                Uncover the truth behind a tragic fire and an integrity award.
                            </span>
                        </button>
                        
                        <button onclick="startStory('story2')" class="choice-btn group block w-full text-left bg-transparent border border-gray-700 hover:border-brand-accent p-6 rounded-md cursor-pointer">
                            <span class="block font-heading text-2xl font-bold text-gray-200 group-hover:text-white transition-colors duration-300">
                                ${stories.story2.title}
                            </span>
                            <span class="block mt-2 text-sm text-gray-400 font-body group-hover:text-gray-300 transition-colors duration-300">
                                Face the consequences of a diverted trust fund before a knighthood nomination.
                            </span>
                        </button>
                    </div>
                </div>
            `;
        }

        // Start a specific story
        function startStory(storyId) {
            transitionTo(() => {
                currentStoryId = storyId;
                currentSceneId = 1;
                sceneHistory = [];
                renderScene(1);
            });
        }

        // Handle a choice selection
        function handleChoice(target) {
            transitionTo(() => {
                if (target === 'menu') {
                    initApp();
                } else {
                    if (currentSceneId) {
                        sceneHistory.push(currentSceneId);
                    }
                    currentSceneId = target;
                    renderScene(target);
                }
            });
        }

        // Go back to the previous scene
        function goBack() {
            if (sceneHistory.length > 0) {
                transitionTo(() => {
                    currentSceneId = sceneHistory.pop();
                    renderScene(currentSceneId);
                });
            }
        }

        // Render a specific scene
        function renderScene(sceneId) {
            const story = stories[currentStoryId];
            const scene = story.scenes[sceneId];
            
            if (scene.bg) {
                bgLayer.style.backgroundImage = `url('${scene.bg}')`;
            }
            
            // Format text to allow beautiful paragraph breaks if needed, though raw text is unformatted.
            // Using a clean wrapper.
            
            let sceneTitle = "";
            if (sceneId === 11) {
                sceneTitle = "Conclusion";
            } else if ([8, 9, 10].includes(sceneId)) {
                let endingNum = sceneId === 8 ? "One" : (sceneId === 9 ? "Two" : "Three");
                sceneTitle = `Ending ${endingNum}`;
            } else {
                sceneTitle = `Scene ${sceneId}`;
            }

            let html = `
                <div class="flex justify-between items-center mb-6">
                    ${sceneHistory.length > 0 ? `<button onclick="goBack()" class="text-brand-accent hover:text-white transition-colors text-sm font-semibold uppercase tracking-wider flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Go Back</button>` : `<div></div>`}
                    <button onclick="handleChoice('menu')" class="text-gray-400 hover:text-white transition-colors text-sm font-semibold uppercase tracking-wider flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> Home</button>
                </div>
                <div class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-end">
                    <h2 class="font-heading text-xl md:text-2xl text-brand-accent font-semibold uppercase tracking-widest">
                        ${story.title}
                    </h2>
                    <span class="text-sm text-gray-500 font-heading italic">
                        ${sceneTitle}
                    </span>
                </div>
                
                <div class="prose prose-invert max-w-none mb-12">
                    <p class="text-lg md:text-xl leading-relaxed text-gray-300">
                        ${scene.text}
                    </p>
                </div>
                
                <div class="flex flex-col gap-4">
            `;

            scene.choices.forEach((choice, index) => {
                html += `
                    <button onclick="handleChoice(${typeof choice.target === 'string' ? `'${choice.target}'` : choice.target})" 
                            class="choice-btn w-full text-left p-4 rounded-md border border-gray-800 bg-black/40 hover:bg-black/60 hover:border-brand-accent/70 flex items-center group focus:outline-none focus:ring-1 focus:ring-brand-accent transition-all duration-300">
                        <span class="text-brand-accent mr-4 opacity-50 group-hover:opacity-100 transition-opacity font-heading font-bold text-xl">
                            ${String.fromCharCode(65 + index)}.
                        </span>
                        <span class="text-gray-300 group-hover:text-white transition-colors text-base md:text-lg font-medium">
                            ${choice.text}
                        </span>
                    </button>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // Start app on load
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

    </script>
</body>
</html>
