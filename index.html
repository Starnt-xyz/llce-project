                    </p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 max-w-3xl mx-auto text-left">
                        <button onclick="startStory('story1')" class="choice-btn group block w-full bg-black/50 border border-gray-700/80 hover:border-brand-accent p-5 sm:p-6 rounded-xl cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-brand-accent/10">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold uppercase tracking-wider text-brand-gold">Story One</span>
                                <span class="text-xs text-gray-500">11 Scenes</span>
                            </div>
                            <h3 class="font-heading text-xl sm:text-2xl font-bold text-gray-100 group-hover:text-white transition-colors">
                                ${stories.story1.title}
                            </h3>
                            <p class="mt-2 text-xs sm:text-sm text-gray-400 font-body leading-normal group-hover:text-gray-300">
                                Elias Mercer, property developer. A defective fire door, a buried report, and a midnight blackmail note on award night.
                            </p>
                            <div class="mt-4 flex items-center text-xs text-brand-accent font-semibold group-hover:translate-x-1 transition-transform">
                                Begin Narrative <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l7-7m7 7H3"></path></svg>
                            </div>
                        </button>

                        <button onclick="startStory('story2')" class="choice-btn group block w-full bg-black/50 border border-gray-700/80 hover:border-brand-accent p-5 sm:p-6 rounded-xl cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-brand-accent/10">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold uppercase tracking-wider text-brand-gold">Story Two</span>
                                <span class="text-xs text-gray-500">11 Scenes</span>
                            </div>
                            <h3 class="font-heading text-xl sm:text-2xl font-bold text-gray-100 group-hover:text-white transition-colors">
                                ${stories.story2.title}
                            </h3>
                            <p class="mt-2 text-xs sm:text-sm text-gray-400 font-body leading-normal group-hover:text-gray-300">
                                Julian Vance, gallery director. Embezzled heritage trust funds, a framed junior curator, and a knighthood nomination.
                            </p>
                            <div class="mt-4 flex items-center text-xs text-brand-accent font-semibold group-hover:translate-x-1 transition-transform">
                                Begin Narrative <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l7-7m7 7H3"></path></svg>
                            </div>
                        </button>
                    </div>

                    <div class="mt-10 sm:mt-12 text-xs text-gray-500 border-t border-gray-800/80 pt-6 max-w-xl mx-auto">
                        Inspired by Oscar Wilde (<em>The Picture of Dorian Gray</em>), Robert Louis Stevenson (<em>Strange Case of Dr Jekyll and Mr Hyde</em>), and Mary Harron (<em>American Psycho</em>).
                    </div>
                </div>
            `;
        }

        // Start a story
        function startStory(storyId) {
            transitionTo(() => {
                currentStoryId = storyId;
                currentSceneId = 1;
                sceneHistory = [];
                renderScene(1);
            });
        }

        // Restart current story
        function restartStory() {
            if (currentStoryId) {
                transitionTo(() => {
                    currentSceneId = 1;
                    sceneHistory = [];
                    renderScene(1);
                });
            }
        }

        // Choice Handler
        function handleChoice(target) {
            transitionTo(() => {
                if (target === 'menu') {
                    initApp();
                } else {
                    if (currentSceneId) {
                        sceneHistory.push(currentSceneId);
                    }
                    currentSceneId = target;
                    renderScene(target);
                }
            });
        }

        // Go Back Handler
        function goBack() {
            if (sceneHistory.length > 0) {
                transitionTo(() => {
                    currentSceneId = sceneHistory.pop();
                    renderScene(currentSceneId);
                });
            }
        }

        // Render Current Scene
        function renderScene(sceneId) {
            const story = stories[currentStoryId];
            const scene = story.scenes[sceneId];
            
            if (scene.bg) {
                bgLayer.style.backgroundImage = `url('${scene.bg}')`;
            }

            let sceneBadge = "";
            if (sceneId === 11) {
                sceneBadge = "Scene 11: Analytical Conclusion";
            } else if ([8, 9, 10].includes(sceneId)) {
                let endingNum = sceneId === 8 ? "One (Truth)" : (sceneId === 9 ? "Two (Mask)" : "Three (Split)");
                sceneBadge = `Scene ${sceneId}: Ending ${endingNum}`;
            } else {
                sceneBadge = `Scene ${sceneId} of 11`;
            }

            // Generate Path Trail
            let pathTrail = "Scene 1";
            sceneHistory.forEach((sNum) => {
                pathTrail += ` → Scene ${sNum}`;
            });
            if (sceneHistory.length > 0) {
                pathTrail += ` → Scene ${sceneId}`;
            }

            // Paragraph formatting for story text
            const formattedParagraphs = scene.text.split('\n\n').map(p => 
                `<p class="mb-4 text-base xs:text-lg sm:text-xl text-gray-200 leading-relaxed font-body">${p.replace(/\n/g, '<br>')}</p>`
            ).join('');

            let html = `
                <!-- Responsive Header Bar -->
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4 sm:mb-6 border-b border-gray-800/80 pb-3 sm:pb-4">
                    <div class="flex items-center gap-2 xs:gap-3">
                        ${sceneHistory.length > 0 ? `
                            <button onclick="goBack()" class="min-h-[44px] px-3 py-2 rounded-lg bg-gray-900/80 hover:bg-gray-800 text-gray-300 hover:text-white transition-all text-xs sm:text-sm font-semibold flex items-center gap-1.5 border border-gray-700/60" title="Go back one decision">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                <span>Back</span>
                            </button>
                        ` : ''}

                        <button onclick="restartStory()" class="min-h-[44px] px-3 py-2 rounded-lg bg-gray-900/80 hover:bg-gray-800 text-gray-300 hover:text-white transition-all text-xs sm:text-sm font-semibold flex items-center gap-1.5 border border-gray-700/60" title="Restart this story">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span class="hidden xs:inline">Restart</span>
                        </button>
                    </div>

                    <button onclick="handleChoice('menu')" class="min-h-[44px] px-3 py-2 rounded-lg bg-brand-accent/20 hover:bg-brand-accent/40 text-brand-gold hover:text-white transition-all text-xs sm:text-sm font-semibold flex items-center gap-1.5 border border-brand-accent/40">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span>Stories Menu</span>
                    </button>
                </div>

                <!-- Story Title & Scene Indicator -->
                <div class="mb-4 sm:mb-6">
                    <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <h2 class="font-heading text-lg xs:text-xl sm:text-2xl text-brand-gold font-bold tracking-wide">
                            ${story.title}
                        </h2>
                        <span class="inline-block px-2.5 py-1 rounded bg-black/60 border border-gray-700 text-xs font-semibold text-gray-300">
                            ${sceneBadge}
                        </span>
                    </div>
                    ${sceneHistory.length > 0 ? `
                        <div class="mt-2 text-[11px] sm:text-xs text-gray-500 font-mono overflow-x-auto whitespace-nowrap pb-1">
                            Path: ${pathTrail}
                        </div>
                    ` : ''}
                </div>

                <!-- Scene Prose Content -->
                <div class="prose prose-invert max-w-none mb-8 sm:mb-10">
                    ${formattedParagraphs}
                </div>

                <!-- Interactive Choices -->
                <div class="space-y-3 sm:space-y-4">
                    <div class="text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">
                        ${scene.choices.length > 1 ? 'Choose Your Action:' : 'Next Step:'}
                    </div>
            `;

            scene.choices.forEach((choice, index) => {
                const letter = String.fromCharCode(65 + index);
                html += `
                    <button onclick="handleChoice(${typeof choice.target === 'string' ? `'${choice.target}'` : choice.target})" 
                            class="choice-btn w-full text-left p-3.5 xs:p-4 sm:p-5 rounded-xl border border-gray-700/80 bg-black/60 hover:bg-black/80 hover:border-brand-accent flex items-start group focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all duration-300">
                        <span class="flex-shrink-0 w-7 h-7 rounded-lg bg-brand-accent/20 border border-brand-accent/40 text-brand-gold font-heading font-bold text-sm flex items-center justify-center mr-3 mt-0.5 group-hover:bg-brand-accent group-hover:text-white transition-colors">
                            ${letter}
                        </span>
                        <span class="text-gray-200 group-hover:text-white transition-colors text-sm xs:text-base sm:text-lg font-medium leading-snug">
                            ${choice.text}
                        </span>
                    </button>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // Start app on DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
